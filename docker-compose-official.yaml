services:
  mcp:
    image: $REPOSITORY/$IMAGE:$TAG
    build:
      context: .
      dockerfile: Dockerfile-official
      platforms:
        - "linux/amd64"
        - "linux/arm64"
        - "linux/ppc64le"
        - "linux/s390x"
      args:
        BUILDKIT_INLINE_CACHE: 0
        TRUSTSTORE_PWD: $TRUSTSTORE_PWD
        VERSION: $VERSION
      no_cache: true
