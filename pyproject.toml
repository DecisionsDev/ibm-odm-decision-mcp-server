[project]
name = "decision-mcp-server"
version = "0.9.0"
description = "An MCP Server enabling integration with IBM Decision Server Runtime to retrieve and invoke decision services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonref",
    "mcp>=2.0.0,<3",
    "pyjwt",
    "python-multipart",
    "pyyaml",
    "requests",
    "starlette",
    "validator_collection",
]

[project.optional-dependencies]
default = [
    "cryptography>=50.0.0",
]
s390x = [
    "cryptography==36.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-html",
    "responses",
]

[[project.authors]]
name = "laurent grateau"
email = "laurent.grateau@fr.ibm.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [
    [
        { extra = "default" },
        { extra = "s390x" },
    ],
]

[project.scripts]
decision-mcp-server = "decision_mcp_server:main"
ibm-odm-decision-mcp-server = "decision_mcp_server:main"
start = "decision_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
